[project]
name = "python-chess-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raja Akel", email = "rajakel99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chess",
    "stockfish",
    "pandas",
